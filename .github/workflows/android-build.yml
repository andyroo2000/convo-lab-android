name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools platforms;android-37.1 build-tools;36.0.0 ndk;30.0.16248370 cmake;3.31.6
          log-accepted-android-sdk-licenses: false
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.4.2'
      - name: Prepare native typing engine
        run: |
          bash scripts/setup_swift_android.sh
          python3 scripts/prepare_typing.py
          python3 scripts/build_typing.py --abi arm64-v8a
          python3 scripts/build_typing.py --abi x86_64
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and check
        run: ./gradlew --no-daemon assembleDebug assembleRelease assembleDebugAndroidTest lintDebug testDebugUnitTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test offline conversion and keyboard layout
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072 -cores 2
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell svc power stayon true
            python3 scripts/test_typing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typing-test-results
          path: |
            app/build/reports/
            app/build/typing-artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: convolab-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
